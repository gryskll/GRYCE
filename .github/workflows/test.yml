# Runs on every pull request: checks the JavaScript parses and runs the
# database tests (dev/test-db.sh) against a throwaway Postgres. Never touches Supabase.
name: Tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript parses
        run: |
          node --check scripts/sync-notion.mjs
          for f in docs/*.js dev/*.js; do node --check "$f"; done
      - name: Database tests
        run: dev/test-db.sh
